name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # 必须带 web 附加组：tests/webapp/** 与 tests/adapters/test_triage_llm.py
        # 在模块级 import fastapi/httpx，缺了会在收集阶段直接报错(非 skip)。
        run: pip install -e '.[dev,web]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test (vitest)
        run: npm run test
      - name: Format check (prettier)
        run: npm run format:check
      - name: Build
        run: npm run build

  doc-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Resolve escape hatch
        run: |
          if echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q 'docs:none-needed'; then
            echo "DOCS_IMPACT_SKIP=1" >> "$GITHUB_ENV"
          elif git log --format=%B origin/${{ github.base_ref }}..HEAD | grep -qi '^Docs-Impact: none'; then
            echo "DOCS_IMPACT_SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Check doc impact
        env:
          DOC_IMPACT_BASE: origin/${{ github.base_ref }}
        run: python scripts/check_doc_impact.py

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render all mermaid blocks
        run: |
          npm i -g @mermaid-js/mermaid-cli
          # mmdc 走 puppeteer 起无头 Chromium；GitHub runner 镜像(Ubuntu 23.10+)限制
          # 非特权用户命名空间，默认沙箱起不来("No usable sandbox!")。CI 容器本身即隔离
          # 边界，这里显式关掉 Chromium 内层沙箱。
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer.json
          python3 - <<'PY'
          import re, pathlib, subprocess, sys, tempfile
          fail = []
          for md in pathlib.Path('.').rglob('*.md'):
              if 'venv/' in str(md): continue
              blocks = re.findall(r'```mermaid\n(.*?)```', md.read_text(), re.S)
              for i, b in enumerate(blocks):
                  with tempfile.NamedTemporaryFile('w', suffix='.mmd', delete=False) as f:
                      f.write(b); src = f.name
                  r = subprocess.run(['mmdc','-p','/tmp/puppeteer.json','-i',src,'-o',src+'.svg'], capture_output=True, text=True)
                  if r.returncode != 0:
                      fail.append(f"{md} block#{i}: {r.stderr[:200]}")
          if fail:
              print("\n".join(fail)); sys.exit(1)
          print("all mermaid blocks render")
          PY
