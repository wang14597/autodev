[project]
name = "autodev"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6"]
web = ["fastapi", "uvicorn", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["live: 需真实 claude/网关, 默认不跑"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# ruff 0.16 起会格式化 Markdown 里的 Python 代码块。docs/ 下的 spec/plan 片段是
# 示意性伪代码(刻意对齐注释、省略实现体),不是可运行源码,交给文档一致性 CI 管;
# 这里把 Markdown 排除,保证格式化只作用于真实 Python 源码,且不随 ruff 版本漂移。
exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = false
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
