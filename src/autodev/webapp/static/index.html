<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>AutoDev 控制台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f9;
        color: #17202e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem 2.5rem;
        background: #fff;
        border: 1px solid #e4e8ef;
        border-radius: 0.75rem;
        box-shadow: 0 1px 3px rgba(23, 32, 46, 0.08);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0.5rem 0;
        color: #667085;
        line-height: 1.6;
      }
      code {
        background: #f4f6f9;
        border: 1px solid #e4e8ef;
        border-radius: 0.25rem;
        padding: 0.1rem 0.4rem;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AutoDev 控制台</h1>
      <p>前端尚未构建。后端 API 已就绪，但没有找到前端构建产物。</p>
      <p>请先构建前端：</p>
      <p>
        <code>cd frontend &amp;&amp; npm ci &amp;&amp; npm run build</code>
      </p>
      <p>构建完成后重新启动后端(或设置 <code>AUTODEV_FRONTEND_DIST</code> 指向构建产物目录)即可看到完整控制台界面。</p>
    </main>
  </body>
</html>
